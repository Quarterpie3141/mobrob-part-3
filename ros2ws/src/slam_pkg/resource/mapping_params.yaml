slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_sim_time: false
    
    max_laser_range: 25.0
    resolution: 0.05
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    transform_publish_period: 0.02
    map_update_interval: 5.0
services:
  mobrob_aria:
    build:
      context: .
      dockerfile: dockerfiles/ariaDockerfile
    pull_policy: build
    logging:
      driver: "none"
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev

  mobrob_ctrl:
    build:
      context: .
      dockerfile: dockerfiles/ctrlDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev

  mobrob_cv:
    build:
      context: .
      dockerfile: dockerfiles/CVDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
      - /home/team8/Documents:/opt/ros2ws/src/cv/img

  mobrob_basic_drive:

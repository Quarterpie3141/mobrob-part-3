    volumes:
      - /dev:/dev

  mobrob_sick2:
    build:
      context: .
      dockerfile: dockerfiles/Sensors/SICKScanDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
      
  mobrob_nav3:
    build:
      context: .
      dockerfile: dockerfiles/nav2Dockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
   

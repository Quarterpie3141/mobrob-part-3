  mobrob_nav4:
    build:
      context: .
      dockerfile: dockerfiles/nav2Dockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
   
  mobrob_image_publisher1:
   build:
     context: .
     dockerfile: dockerfiles/image_publisherDockerfile
   pull_policy: build
   network_mode: host
   stdin_open: true
   tty: true
   privileged: true
   volumes: 
     - /dev:/dev
     - /dev/bus/usb:/dev/bus/usb
   device_cgroup_rules:
     - 'c 189:* rmw'
  
  mobrob_greek1:
    build:
      context: .
      dockerfile: dockerfiles/greekDockerfile
    pull_policy: build
    network_mode: host

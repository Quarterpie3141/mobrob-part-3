services:
  mobrob_aria2:
    build:
      context: .
      dockerfile: dockerfiles/ariaDockerfile
    pull_policy: build
    logging:
      driver: "none"
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev

  mobrob_ctrl2:
    build:
      context: .
      dockerfile: dockerfiles/ctrlDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev

  mobrob_cv2:
    build:
      context: .
      dockerfile: dockerfiles/CVDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - /dev:/dev
      - /home/team8/Documents:/opt/ros2ws/src/cv/img

  mobrob_global_controller2:
    build:
      context: .
      dockerfile: dockerfiles/globalcontrollerDockerfile
    pull_policy: build
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true 
    restart: unless-stopped
    volumes:
      - /dev:/dev

  mobrob_ekf2:
    build:
      context: .
